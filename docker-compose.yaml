services:
    beacon:
        container_name: beacon
        build: .
        restart: unless-stopped
        environment:
            # Required — the connect backend proxies /rest, /auth and library
            # requests through to Navidrome (see connect/routes/proxy.py) and
            # needs its own address to reach it; replace with your server's
            # actual LAN address/port.
            - SERVER_INTERNAL_URL=http://navidrome:4533
            # CONNECT_TOKEN secures the Connect API (casting control). Leave it
            # unset — a random one is generated on each container start, which
            # is enough since the browser never needs to know it (nginx injects
            # it server-side). Only set this if something needs to call the API
            # directly, bypassing nginx, with a token that survives restarts:
            # - CONNECT_TOKEN=SzArltWiDYl44aguM2qy5qQJAD15WV3MOIzsKGnvdXeGIn4kS5JHgVBrgfiUm6y5
            # - DEBUG=true # Verbose playback logs for AirPlay + Sonos
            # - TARGETS=sonos:Living Room,airplay:Kitchen # Pre-configure fixed devices without going through Beacon's UI
            # Only needed if 9180/9181 are already taken on the host — e.g.
            # running a second instance at the same time:
            # - WEB_PORT=9180 # nginx / the Beacon web UI
            # - PORT=9181     # Connect API (Python backend)
        # Keeps AirPlay 2 pairings across container recreations/updates.
        volumes:
            - ./data:/data
        # Required for Sonos/AirPlay/Chromecast mDNS discovery on the LAN.
        network_mode: host
        # With host networking the ports below are bound directly — no
        # mapping needed, kept here for documentation only: nginx on 9180,
        # connect API on 9181.
        # ports:
        #     - 9180:9180
        #     - 9181:9181
