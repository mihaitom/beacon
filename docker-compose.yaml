services:
    beacon:
        container_name: beacon
        build: .
        restart: unless-stopped
        environment:
            # Required — the connect backend proxies /rest, /auth and library
            # requests through to Navidrome (see connect/routes/proxy.py) and
            # needs its own address to reach it; replace with your server's
            # actual LAN address/port.
            - SERVER_INTERNAL_URL=http://navidrome:4533
            # CONNECT_TOKEN secures the Connect API (casting control). Leave it
            # unset — a random one is generated on each container start, which
            # is enough since the browser never needs to know it (nginx injects
            # it server-side). Only set this if something needs to call the API
            # directly, bypassing nginx, with a token that survives restarts:
            # - CONNECT_TOKEN=SzArltWiDYl44aguM2qy5qQJAD15WV3MOIzsKGnvdXeGIn4kS5JHgVBrgfiUm6y5
            # - DEBUG=true # Verbose playback logs for AirPlay + Sonos
            # - TARGETS=sonos:Living Room,airplay:Kitchen # Pre-configure fixed devices without going through Beacon's UI
            # Only needed if 9180/9181 are already taken on the host — e.g.
            # running a second instance at the same time:
            # - WEB_PORT=9180 # nginx / the Beacon web UI
            # - PORT=9181     # Connect API (Python backend)
            #
            # SERVER_URL is unrelated to SERVER_INTERNAL_URL above: it never
            # goes through the proxy — SERVER_INTERNAL_URL is what the backend
            # actually talks to Navidrome through (proxied /rest, /auth, and
            # its own direct calls); SERVER_URL is the server's public-facing
            # identity, only used for the login allowlist below and (when set)
            # to prefill the login screen. Combined with SERVER_LOCK=true:
            #  - /config only accepts a login whose server URL matches
            #    SERVER_URL (or SERVER_INTERNAL_URL, if SERVER_URL isn't set)
            #    — without this, anyone who has (or guesses) CONNECT_TOKEN
            #    could point this deployment's /config at a *different* real
            #    media server's valid credentials and still reach your LAN
            #    devices through it.
            #  - The login screen skips asking for a server URL or type
            #    entirely (there's only one possible server, so nothing to
            #    choose) — GET /health hands it SERVER_URL (or
            #    SERVER_INTERNAL_URL as a fallback) and it's prefilled
            #    automatically; only username/password are asked for.
            # Optional and off by default — most single-user home setups don't
            # need it, it matters more once CONNECT_TOKEN might be shared or
            # exposed beyond your own devices:
            # - SERVER_URL=https://navidrome.example.com
            # - SERVER_LOCK=true
        # Keeps AirPlay 2 pairings across container recreations/updates.
        volumes:
            - ./data:/data
        # Required for Sonos/AirPlay/Chromecast mDNS discovery on the LAN.
        network_mode: host
        # With host networking the ports below are bound directly — no
        # mapping needed, kept here for documentation only: nginx on 9180,
        # connect API on 9181.
        # ports:
        #     - 9180:9180
        #     - 9181:9181
