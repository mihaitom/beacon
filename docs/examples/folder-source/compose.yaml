services:
  folder-source:
    build: .
    container_name: beacon-folder-source
    restart: unless-stopped
    # The music is only read, never changed.
    volumes:
      - /path/to/music:/music:ro
      - ./data:/data
    environment:
      SOURCE_NAME: Music folder
      # Beacon sends it with every request for the page; set the same value
      # in Beacon under Settings > Library > External sources.
      TOKEN: change-me
      RESCAN_MINUTES: 30
    ports:
      - "8800:8800"
