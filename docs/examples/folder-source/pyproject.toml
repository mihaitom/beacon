[project]
name = "beacon-folder-source"
version = "1.0.0"
description = "A Beacon external source for a folder of music"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.47",
    "starlette>=1.0",
    "uvicorn>=0.40",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx`"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
