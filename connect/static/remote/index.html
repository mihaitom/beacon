<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Beacon Remote</title>
  <meta name="theme-color" content="#12141c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Beacon" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="fonts/mdi.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="login-screen" class="screen hidden">
    <div class="login-card">
      <h1>Beacon Remote</h1>
      <p class="muted">Enter the 6-digit code shown in Beacon's Settings.</p>
      <form id="login-form">
        <input id="pin-input" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6"
               autocomplete="one-time-code" placeholder="000000" />
        <button type="submit" class="btn btn-primary">Connect</button>
      </form>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <div id="app-screen" class="screen hidden">
    <!-- Same lighthouse mark + wordmark as
     - src/renderer/src/layouts/MobileLayout.vue's <v-app-bar> — see
     - app.css's .app-bar. -->
    <header class="app-bar">
      <i class="mdi mdi-lighthouse-on app-bar__icon"></i>
      <span class="app-bar__title">Beacon</span>
    </header>
    <main id="view-root"></main>
    <!-- Icons/labels/order match MobileTabBar.vue's own `items` exactly. -->
    <nav class="tabbar">
      <a href="#/now-playing" data-tab="now-playing">
        <i class="mdi mdi-play-circle-outline icon"></i><span>Now Playing</span>
      </a>
      <a href="#/queue" data-tab="queue">
        <i class="mdi mdi-playlist-music icon"></i><span>Queue</span>
      </a>
      <a href="#/playlists" data-tab="playlists">
        <i class="mdi mdi-playlist-play icon"></i><span>Playlists</span>
      </a>
      <a href="#/songs" data-tab="songs">
        <i class="mdi mdi-music-note icon"></i><span>Songs</span>
      </a>
      <a href="#/radio" data-tab="radio">
        <i class="mdi mdi-radio icon"></i><span>Radio</span>
      </a>
    </nav>
  </div>

  <div id="disconnected-banner" class="banner hidden">Connection lost — retrying…</div>
  <button id="interrupted-banner" type="button" class="banner banner-action hidden">
    Playback was interrupted — tap to resume
  </button>
  <div id="command-error-banner" class="banner hidden">That didn't reach Beacon — try again</div>

  <script type="module" src="app.js"></script>
</body>
</html>
