[project]
name = "beacon-connect"
version = "1.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "async-upnp-client>=0.47.0",
    "fastapi[all]>=0.136.1",
    "httpx>=0.28.1",
    "numpy>=2.0.0",
    "pillow>=12.3.0",
    "pyatv>=0.17.0",
    "pychromecast>=14.0.0",
    "python-dotenv>=1.2.2",
    "soco>=0.31.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "httpx2>=2.5.0",
    "ruff>=0.15.13",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
# Wider than ruff's default 88, to match how this code is actually written
# (median line 43 chars, p99 90, longest 113 — hand-wrapped, and already
# consistent). At 88 the formatter would *add* ~1550 lines and break up 18
# spots that read better as they are: constant tables whose trailing
# comments push them a few chars over, and single-expression lambdas in
# tests. At 100 it removes ~390 lines instead and leaves those alone.
line-length = 100

[tool.ruff.lint]
ignore = [
    # `Depends(...)` as an argument default is FastAPI's own dependency-
    # injection idiom (straight from FastAPI's docs) — evaluated specially
    # by FastAPI itself, not a real "mutable default" foot-gun. Flagged on
    # essentially every route handler in routes/*.py; fighting the
    # framework's own convention here would make every handler worse to
    # read for no actual safety gain.
    "B008",
    # Catching bare `Exception` is this backend's deliberate failure mode,
    # not an oversight. Everything below routes/ and delivery/ talks to
    # hardware and servers that fail in ways no exception hierarchy covers:
    # a speaker drops off the network mid-track, a Jellyfin instance restarts
    # during a cover-art fetch, pyatv raises a bare KeyError when a HomePod's
    # pair-setup response is short a field. The rule the codebase actually
    # follows is "catch everything, log it, degrade" — a bridge handler turns
    # any failure into a Subsonic error envelope instead of a 500, and a
    # cast delivery that dies must never take the session down with it.
    # Verified 2026-08-29: every one of the 63 flagged sites logs or
    # otherwise surfaces its exception; none swallow silently (the ones that
    # did were fixed in the same pass). S110/S112 — the rules for an except
    # branch that is genuinely empty — stay enabled, and are the real guard
    # here: catching broadly is fine, catching and saying nothing is not.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Test-only relaxations. Both rules are real in production code and stay
# enabled there; inside tests they flag the shape of the test itself, not a
# defect in what it covers.
"tests/**" = [
    # Nested `with` for stacked mocks. A test that patches four collaborators
    # reads better as four indented `with patch(...)` lines than as one
    # combined statement wrapped across the same number of lines anyway.
    "SIM117",
    # Blocking `open()` inside an async test. pytest-asyncio runs each test
    # in its own loop with nothing else scheduled on it, so a synchronous
    # read of a fixture file blocks nobody.
    "ASYNC230",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real third-party lyrics provider APIs over the network; excluded by default, run with `-m live`",
]

[tool.coverage.run]
source = ["core", "routes", "delivery", "media", "lyrics", "main"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
