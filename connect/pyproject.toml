[project]
name = "beacon-connect"
version = "1.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "async-upnp-client>=0.47.0",
    "fastapi[all]>=0.136.1",
    "httpx>=0.28.1",
    "numpy>=2.0.0",
    "pillow>=12.3.0",
    "pyatv>=0.17.0",
    "pychromecast>=14.0.0",
    "python-dotenv>=1.2.2",
    "soco>=0.31.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "httpx2>=2.5.0",
    "ruff>=0.15.13",
    "pytest-cov>=7.1.0",
]

[tool.ruff.lint]
ignore = [
    # `Depends(...)` as an argument default is FastAPI's own dependency-
    # injection idiom (straight from FastAPI's docs) — evaluated specially
    # by FastAPI itself, not a real "mutable default" foot-gun. Flagged on
    # essentially every route handler in routes/*.py; fighting the
    # framework's own convention here would make every handler worse to
    # read for no actual safety gain.
    "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real third-party lyrics provider APIs over the network; excluded by default, run with `-m live`",
]

[tool.coverage.run]
source = ["core", "routes", "delivery", "media", "lyrics", "main"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
