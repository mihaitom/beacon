name: Publish Electron for all Platforms (Manual)

# Same platform matrix as publish.yml, minus the Docker image — for when
# only the desktop app needs a fresh release across every platform.

on: workflow_dispatch

jobs:
    ensure-release:
        permissions:
            contents: write
        uses: ./.github/workflows/_ensure-release.yml

    publish-electron:
        needs: ensure-release
        permissions:
            contents: write
        uses: ./.github/workflows/_publish-electron.yml
        with:
            # See publish.yml's own matrix comment: x64/arm64 Linux each need
            # their own native runner, so this stays a 4-entry matrix rather
            # than collapsing arm64 into the x64 leg.
            matrix: |
                [
                  {"os": "windows-latest", "script": "publish:win"},
                  {"os": "macos-26", "script": "publish:mac", "node_options": "--max-old-space-size=4096"},
                  {"os": "ubuntu-latest", "script": "publish:linux"},
                  {"os": "ubuntu-24.04-arm", "script": "publish:linux-arm64", "arm64_build_tools": true}
                ]
