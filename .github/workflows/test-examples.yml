name: Test examples

# The example apps in docs/examples/ are not part of Beacon's build, but a
# reader runs them as they are, so they are tested like the app.
on:
  workflow_dispatch:
  push:
    branches: [main, development]
    paths:
      - docs/examples/**
  pull_request:
    paths:
      - docs/examples/**

jobs:
  folder-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/examples/folder-source

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Lint
        run: uv run --group dev ruff check .

      - name: Check formatting
        run: uv run --group dev ruff format --check .

      # The tests make their songs with ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: uv run --group dev pytest
