name: Test examples

# The example apps in docs/examples/ are not part of Beacon's build, but a
# reader runs them as they are, so they are tested like the app.
on:
  workflow_dispatch:
  # publish-folder-source.yml runs it before publishing the image.
  workflow_call:
  push:
    branches: [main, development]
    paths:
      - docs/examples/**
  pull_request:
    paths:
      - docs/examples/**

jobs:
  folder-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/examples/folder-source

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Lint
        run: uv run --group dev ruff check .

      - name: Check formatting
        run: uv run --group dev ruff format --check .

      # The tests make their songs with ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: uv run --group dev pytest

  live-music-archive:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/examples/live-music-archive

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Lint
        run: uv run --group dev ruff check .

      - name: Check formatting
        run: uv run --group dev ruff format --check .

      # No internet needed: the tests stand in for archive.org.
      - name: Run tests
        run: uv run --group dev pytest
