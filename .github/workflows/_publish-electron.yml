name: (internal) Publish Electron

# Reusable workflow, not meant to be dispatched directly — builds and
# publishes the Electron desktop app for whichever platform legs the
# caller's `matrix` input lists. Shared by every "Publish *" workflow that
# ships the desktop app (publish.yml, publish-electron-all-platforms.yml,
# publish-linux.yml, publish-macos.yml, publish-windows.yml): each supplies
# its own subset of platforms as a JSON array of
# {os, script, arm64_build_tools?, node_options?} entries (see the `matrix`
# input below), and the actual build steps are only ever written once here.
#
# Callers are expected to `needs:` the job that calls this workflow on
# their own call to _ensure-release.yml first — not enforced here, since
# this workflow has no way to see another job's completion from inside
# itself.

on:
    workflow_call:
        inputs:
            matrix:
                description: >-
                    JSON array of {os, script, arm64_build_tools?,
                    node_options?} entries, one per platform leg to build —
                    see the individual publish-*.yml callers for the actual
                    lists and why each one is split out the way it is.
                    `script` is the pnpm script to run (publish:win/
                    publish:mac/publish:linux/publish:linux-arm64).
                    arm64_build_tools (bool) installs a C++ compiler first
                    (see that step below); node_options is passed through
                    as NODE_OPTIONS (macOS needs a larger heap, see the
                    build step below).
                required: true
                type: string

env:
    # Silences a Node20-deprecation warning several of the JS actions below
    # would otherwise print on every run.
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    publish:
        runs-on: ${{ matrix.os }}

        # Required so electron-builder's `--publish always` can create/attach
        # to the release.
        permissions:
            contents: write

        strategy:
            fail-fast: false
            matrix:
                # Under `include:`, not as the matrix itself: every caller
                # passes a JSON array of ready-made legs ([{os, script, ...}])
                # rather than axes to combine, and `strategy.matrix` only ever
                # accepts an object - handed a bare sequence it fails the whole
                # run before a single job starts ("A sequence was not
                # expected"). `include` is what takes a list of complete
                # combinations, which is exactly what these are.
                include: ${{ fromJson(inputs.matrix) }}

        steps:
            - name: Checkout git repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Node and PNPM
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            # Required for package:connect (`uv run connect/packaging/build-binary.py`).
            # uv installs the required Python version itself.
            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

            # miniaudio (a pyatv/AirPlay dependency) has no prebuilt wheel for
            # arm64 on any Linux libc — `uv sync` (invoked by package:connect) has
            # to compile it from source there, which needs a C++ compiler. Not
            # needed on any x64 leg (it has a prebuilt wheel) — gated per-leg via
            # the caller's own `arm64_build_tools` matrix entry rather than an
            # OS-name check here, since this workflow doesn't otherwise know
            # which legs are arm64.
            - name: Install build tools (arm64 native compile)
              if: matrix.arm64_build_tools
              run: sudo apt-get update -qq && sudo apt-get install -y build-essential

            - name: Install dependencies
              run: pnpm install

            # The bundled ffmpeg (build/ffmpeg/README.md). Keyed on what
            # decides the binary's contents, and deliberately not on
            # required-components or verify-ffmpeg.sh: those decide whether
            # it is acceptable, and are checked against whatever this step
            # ends up with either way — the build script runs that check on
            # its up-to-date path too, so a restored binary is checked as
            # thoroughly as a fresh one. Keying on them would only turn a
            # one-line contract edit into a 10-minute rebuild per platform.
            - name: Restore bundled ffmpeg
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      build/ffmpeg/ffmpeg
                      build/ffmpeg/ffmpeg.exe
                      build/ffmpeg/.built
                  key: ffmpeg-${{ matrix.os }}-${{ hashFiles('build/ffmpeg/versions', 'build/ffmpeg/configure-flags', 'scripts/build-ffmpeg.sh', 'Dockerfile') }}

            # Windows builds it in MSYS2 (mingw64 toolchain and static
            # libraries); the script's own Windows branch expects to be run
            # from there, and a binary built in the plain MSYS environment
            # would need MSYS2's own runtime beside it. Linux and macOS run
            # it in the job's own shell — see build/ffmpeg/README.md for what
            # each platform needs.
            #
            # Not redundant with the `publish:*` scripts building ffmpeg
            # themselves, which is worth knowing before dropping it as such:
            # those run from PowerShell and reach the script through Git
            # Bash, where `uname -s` says MINGW64 and it takes this same
            # Windows branch — which installs its toolchain with `pacman`,
            # and Git Bash has none. It survives that only because this step
            # has already built and stamped the binary.
            - name: Set up MSYS2 (Windows ffmpeg build)
              if: startsWith(matrix.os, 'windows')
              uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
              with:
                  msystem: MINGW64
                  update: false
                  install: base-devel curl tar xz

            # Builds the binary, and fails the release if what came out is
            # missing anything the app needs (scripts/verify-ffmpeg.sh, which
            # the build script runs itself — including on a cache hit, where
            # nothing is rebuilt).
            #
            # Two steps rather than one with an expression in `shell:`:
            # `shell` is one of the few fields that take no context at all,
            # so `${{ matrix.* }}` there is silently not what it looks like.
            - name: Build bundled ffmpeg (Windows)
              if: startsWith(matrix.os, 'windows')
              shell: msys2 {0}
              run: ./scripts/build-ffmpeg.sh

            - name: Build bundled ffmpeg
              if: ${{ !startsWith(matrix.os, 'windows') }}
              shell: bash
              run: ./scripts/build-ffmpeg.sh

            - name: Build and Publish releases
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_OPTIONS: ${{ matrix.node_options }}
              uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run ${{ matrix.script }}
                  on_retry_command: pnpm cache delete
