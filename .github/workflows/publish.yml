name: Publish (Manual)

# Everything a release needs in one dispatch: the desktop app for every
# platform (_publish-electron.yml) and the Docker image (_publish-docker.yml).
# Split out as their own "Publish <platform>"/"Publish Docker" workflows too
# (see those files) for when only one leg needs a rebuild — e.g. retrying
# just Windows after a flaky run, without re-publishing everything else.

on: workflow_dispatch

jobs:
    ensure-release:
        permissions:
            contents: write
        uses: ./.github/workflows/_ensure-release.yml

    publish-electron:
        needs: ensure-release
        permissions:
            contents: write
        uses: ./.github/workflows/_publish-electron.yml
        with:
            # x64 and arm64 Linux each build on their own native runner — the
            # bundled Connect backend binary is built by PyInstaller during
            # `pnpm run package:connect` and can't be cross-compiled (see
            # publish-linux.yml's own matrix comment). fail-fast: false (set
            # inside _publish-electron.yml) means one platform failing (e.g.
            # an experimental arm64 leg) doesn't cancel the other,
            # already-working platforms' release.
            matrix: |
                [
                  {"os": "windows-latest", "script": "publish:win"},
                  {"os": "macos-26", "script": "publish:mac", "node_options": "--max-old-space-size=4096"},
                  {"os": "ubuntu-latest", "script": "publish:linux"},
                  {"os": "ubuntu-24.04-arm", "script": "publish:linux-arm64", "arm64_build_tools": true}
                ]

    publish-docker:
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/_publish-docker.yml
