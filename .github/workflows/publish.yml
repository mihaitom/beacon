name: Publish (Manual)

on: workflow_dispatch

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    # electron-builder's GitHub publisher (releaseType: draft, see
    # electron-builder.yml) looks up the release for the current version's
    # tag and only creates one if none exists yet — but that lookup-then-create
    # isn't atomic, so when multiple platform jobs hit it around the same time
    # (parallel matrix legs, all builds taking a similar number of minutes),
    # each can see "no release yet" and create its own duplicate draft, each
    # holding only its own platform's assets. Creating the release once here,
    # *before* any of the (multi-minute) platform builds start, means every
    # platform job's own lookup always finds it already there and just
    # attaches its assets — no race left to lose. `needs: ensure-release`
    # below makes every platform job wait for this to finish first.
    ensure-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout git repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Read version
              id: version
              run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
            - name: Ensure draft release exists
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="v${{ steps.version.outputs.value }}"
                  gh release view "$TAG" --repo "${{ github.repository }}" \
                      || gh release create "$TAG" --repo "${{ github.repository }}" \
                          --title "${{ steps.version.outputs.value }}" --draft --notes ""

    publish:
        needs: ensure-release
        runs-on: ${{ matrix.os }}

        permissions:
            contents: write

        # x64 and arm64 Linux each build on their own native runner — the bundled
        # Connect backend binary is built by PyInstaller during `pnpm run package:connect`
        # and can't be cross-compiled (see publish-linux.yml). fail-fast: false so
        # one platform failing (e.g. an experimental arm64 leg) doesn't cancel the
        # other, already-working platforms' release.
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-26, ubuntu-latest, ubuntu-24.04-arm]

        steps:
            - name: Checkout git repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Node and PNPM
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            # Required for package:connect (`uv run connect/packaging/build-binary.py`).
            # uv installs the required Python version itself.
            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

            # miniaudio (a pyatv/AirPlay dependency) has no prebuilt wheel for
            # arm64 on any Linux libc — `uv sync` (invoked by package:connect) has
            # to compile it from source there, which needs a C++ compiler. Not
            # needed on ubuntu-latest (x64 has a prebuilt wheel), so gated to
            # just the arm64 leg.
            - name: Install build tools (arm64 native compile)
              if: matrix.os == 'ubuntu-24.04-arm'
              run: sudo apt-get update -qq && sudo apt-get install -y build-essential

            - name: Install dependencies
              run: pnpm install

            - name: Build and Publish releases (Windows)
              if: matrix.os == 'windows-latest'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run publish:win
                  on_retry_command: pnpm cache delete

            - name: Build and Publish releases (macOS)
              if: matrix.os == 'macos-26'
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run publish:mac
                  on_retry_command: pnpm cache delete

            # x64 and arm64 each build on their own native runner — see
            # publish-linux.yml's matrix comment for why (PyInstaller can't
            # cross-compile the bundled Connect backend binary).
            - name: Build and Publish releases (Linux)
              if: matrix.os == 'ubuntu-latest'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run publish:linux
                  on_retry_command: pnpm cache delete

            - name: Build and Publish releases (Linux ARM64)
              if: matrix.os == 'ubuntu-24.04-arm'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run publish:linux-arm64
                  on_retry_command: pnpm cache delete

    # Builds amd64 and arm64 on their own native runners (no QEMU) — the
    # frontend build is JS/memory-heavy enough that emulated arm64 via QEMU
    # on a shared x86 runner either OOMs or hangs indefinitely. Each platform
    # is pushed by digest, then merged into one multi-arch manifest by the
    # docker-merge job below. See:
    # https://docs.docker.com/build/ci/github-actions/multi-platform/
    docker-build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        steps:
            - name: Prepare platform pair
              run: |
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Log in to the Container registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Read version
              id: version
              run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
            - name: Extract metadata (labels) for Docker
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ steps.version.outputs.value }}
                      type=raw,value=latest
            - name: Setup Docker buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
            # provenance/sbom disabled: buildx would otherwise add extra
            # "unknown/unknown" attestation-manifest entries to the merged
            # index (see the docker-merge job below), which some auto-update
            # tooling (e.g. older Watchtower versions) fails to parse when
            # comparing digests, silently skipping the update.
            - name: Build and push image by digest
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  labels: ${{ steps.meta.outputs.labels }}
                  provenance: false
                  sbom: false
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"
            - name: Upload digest
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: digests-${{ env.PLATFORM_PAIR }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    docker-merge:
        runs-on: ubuntu-latest
        needs: docker-build
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Download digests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true
            - name: Log in to the Container registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Read version
              id: version
              run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
            - name: Extract metadata (tags) for Docker
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ steps.version.outputs.value }}
                      type=raw,value=latest
            - name: Setup Docker buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
            - name: Create manifest list and push
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                      $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
              env:
                  DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
            - name: Inspect image
              run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
