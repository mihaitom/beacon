name: Publish Docker to GHCR (Manual)

# Also runs as part of publish.yml (its publish-docker job, same
# _publish-docker.yml) so a single "Publish (Manual)" dispatch covers
# everything — this standalone workflow stays around for when only the
# Docker image needs a rebuild.

on: workflow_dispatch

jobs:
    publish-docker:
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/_publish-docker.yml
