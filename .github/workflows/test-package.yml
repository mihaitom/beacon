name: Test desktop package

# Packages the desktop app on every platform a release ships, without
# publishing anything: `pnpm run package:dir` stops at the unpacked
# directory — no installer, no release, nothing uploaded — and the job then
# checks that what the app needs at runtime actually ended up inside it.
#
# It exists for the step nothing else covers. The publish workflows build the
# bundled binaries and hand everything to electron-builder, and whether
# `extraResources` really placed them is only visible in the finished
# package. A wrong path there produces a working build and an app that falls
# back to a system ffmpeg — or finds none at all.
#
# The steps are deliberately the publish workflow's own, in the same order,
# so this exercises the path a release takes rather than a simplified one:
# ffmpeg built in MSYS2 on Windows, then `package:dir` reaching the same
# script again through Git Bash, where it finds its work already done.

on:
    workflow_dispatch:
    push:
        paths:
            - 'electron-builder.yml'
            - 'package.json'
            - 'src/main/**'
            - 'build/ffmpeg/**'
            - 'scripts/build-ffmpeg.sh'
            - 'scripts/verify-ffmpeg.sh'
            - '.github/workflows/test-package.yml'

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    package:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                # Mirrors the publish matrix — same runners, same flags.
                # `arm64_build_tools` is the same per-leg switch the publish
                # workflow uses for miniaudio's source build; node_options is
                # the larger heap macOS needs.
                include:
                    - { os: ubuntu-latest, name: linux-x64 }
                    - { os: ubuntu-24.04-arm, name: linux-arm64, arm64_build_tools: true }
                    - { os: macos-26, name: macos-arm64, node_options: '--max-old-space-size=4096' }
                    - { os: windows-latest, name: windows-x64 }

        steps:
            - name: Checkout git repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Node and PNPM
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            # Required for package:connect (PyInstaller); uv installs the
            # Python version itself.
            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

            - name: Install build tools (arm64 native compile)
              if: matrix.arm64_build_tools
              run: sudo apt-get update -qq && sudo apt-get install -y build-essential

            - name: Install dependencies
              run: pnpm install

            # The publish workflow's own key for each platform, so a green run
            # here leaves the binary ready for the next release on this branch.
            # See the comment there for what is deliberately not in it.
            - name: Restore bundled ffmpeg
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      build/ffmpeg/ffmpeg
                      build/ffmpeg/ffmpeg.exe
                      build/ffmpeg/.built
                  key: ffmpeg-${{ matrix.os }}-${{ hashFiles('build/ffmpeg/versions', 'build/ffmpeg/configure-flags', 'scripts/build-ffmpeg.sh', 'Dockerfile') }}

            - name: Set up MSYS2 (Windows ffmpeg build)
              if: startsWith(matrix.os, 'windows')
              uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
              with:
                  msystem: MINGW64
                  update: false
                  install: base-devel curl tar xz

            - name: Build bundled ffmpeg (Windows)
              if: startsWith(matrix.os, 'windows')
              shell: msys2 {0}
              run: ./scripts/build-ffmpeg.sh

            - name: Build bundled ffmpeg
              if: ${{ !startsWith(matrix.os, 'windows') }}
              shell: bash
              run: ./scripts/build-ffmpeg.sh

            # Builds the Python backend and the renderer, and lays the whole
            # thing out as it would be installed. On Windows this reaches
            # build-ffmpeg.sh again through Git Bash, which is the shell a
            # release verifies in — the one combination test-ffmpeg.yml
            # cannot cover.
            - name: Package
              env:
                  NODE_OPTIONS: ${{ matrix.node_options }}
              run: pnpm run package:dir

            - name: Check what ended up in the package
              shell: bash
              run: |
                  set -euo pipefail

                  # Found rather than assumed: the layout differs per platform
                  # (linux-unpacked/resources, win-unpacked/resources,
                  # mac-arm64/Beacon.app/Contents/Resources), and a wrong guess
                  # here would report a packaging problem that isn't one.
                  ffmpeg="$(find dist -type f \( -name ffmpeg -o -name ffmpeg.exe \) -path '*esources*' | sed -n 1p)"
                  if [ -z "$ffmpeg" ]; then
                      echo "MISSING: no packaged ffmpeg anywhere under dist/"
                      find dist -maxdepth 5 -type d | head -40
                      exit 1
                  fi
                  echo "Packaged ffmpeg: $ffmpeg"
                  test -x "$ffmpeg" || { echo "MISSING: $ffmpeg is not executable"; exit 1; }
                  "$ffmpeg" -hide_banner -version | sed -n 1p

                  # The same contract the build checked, now against the copy
                  # that is actually shipping — extraResources could have
                  # placed a stale or truncated file.
                  ./scripts/verify-ffmpeg.sh "$ffmpeg" build/ffmpeg/required-components

                  backend="$(find dist -type f \( -name connect-server -o -name connect-server.exe \) -path '*esources*' | sed -n 1p)"
                  if [ -z "$backend" ]; then
                      echo "MISSING: no packaged backend binary under dist/"
                      exit 1
                  fi
                  echo "Packaged backend: $backend ($(du -h "$backend" | cut -f1))"
                  test -x "$backend" || { echo "MISSING: $backend is not executable"; exit 1; }
