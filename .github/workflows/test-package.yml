name: Test desktop package

# Packages the desktop app without publishing anything, and checks that what
# the app needs at runtime actually ended up inside it. `pnpm run package:dir`
# stops at the unpacked directory — no installer, no release, nothing
# uploaded.
#
# It exists for the step nothing else covers: the publish workflows build the
# bundled binaries and then hand everything to electron-builder, and whether
# `extraResources` really placed them is only ever visible in the finished
# package. A wrong path there produces a working build and an app that falls
# back to a system ffmpeg — or finds none at all.
#
# Linux only. The question here is whether the packaging config is right,
# which is not platform-specific; whether each platform can *build* its
# binaries is what test-ffmpeg.yml answers, on all four.

on:
    workflow_dispatch:
    push:
        paths:
            - 'electron-builder.yml'
            - 'package.json'
            - 'src/main/**'
            - 'build/ffmpeg/**'
            - 'scripts/build-ffmpeg.sh'
            - '.github/workflows/test-package.yml'

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    package:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout git repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Node and PNPM
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            # Required for package:connect (PyInstaller); uv installs the
            # Python version itself.
            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

            - name: Install dependencies
              run: pnpm install

            # Literally the publish workflow's own key for this platform
            # (its `matrix.os` is `ubuntu-latest` here), so the three
            # workflows share one cached binary instead of building it three
            # times. See the comment there for what is deliberately not in
            # the key.
            - name: Restore bundled ffmpeg
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      build/ffmpeg/ffmpeg
                      build/ffmpeg/ffmpeg.exe
                      build/ffmpeg/.built
                  key: ffmpeg-ubuntu-latest-${{ hashFiles('build/ffmpeg/versions', 'build/ffmpeg/configure-flags', 'scripts/build-ffmpeg.sh', 'Dockerfile') }}

            # Builds ffmpeg (or restores it), the Python backend, the
            # renderer, and lays the whole thing out as it would be installed
            # — without producing an installer or touching a release.
            - name: Package
              run: pnpm run package:dir

            - name: Check what ended up in the package
              run: |
                  set -euo pipefail
                  resources="$(find dist -maxdepth 3 -type d -name resources | head -1)"
                  test -n "$resources" || { echo "no resources directory in dist/"; exit 1; }
                  echo "Packaged resources: $resources"
                  ls -la "$resources"

                  ffmpeg="$resources/ffmpeg/ffmpeg"
                  test -x "$ffmpeg" || { echo "MISSING: $ffmpeg is not in the package"; exit 1; }
                  "$ffmpeg" -hide_banner -version | head -1

                  # The same contract the build checked, now against the copy
                  # that is actually shipping — extraResources could have
                  # placed a stale or truncated file.
                  ./scripts/verify-ffmpeg.sh "$ffmpeg" build/ffmpeg/required-components

                  backend="$resources/connect-server/connect-server"
                  test -x "$backend" || { echo "MISSING: $backend is not in the package"; exit 1; }
                  echo "Backend binary present: $(du -h "$backend" | cut -f1)"
