name: Frontend Tests

# No pnpm run test here — beacon has no vitest suite yet. type-check + lint
# are what actually catch regressions today; swap/add a real test step here
# once one exists.
on:
    workflow_dispatch:
    push:
        branches: [development, main]
        paths:
            - src/**
            - package.json
            - pnpm-lock.yaml
            - tsconfig*.json
    pull_request:
        paths:
            - src/**
            - package.json
            - pnpm-lock.yaml
            - tsconfig*.json

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Install Node and PNPM
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Install dependencies
              run: pnpm install

            - name: Type-check
              run: pnpm run type-check

            # Not `pnpm run lint` — that runs oxlint/eslint with --fix, which
            # would silently rewrite files in the ephemeral CI checkout and
            # still exit 0 for anything auto-fixable, defeating the point of
            # a CI gate. Same tools, no --fix, so this actually fails on
            # violations instead of quietly "fixing" them and moving on.
            - name: Lint
              run: |
                  pnpm exec oxlint .
                  pnpm exec eslint .
