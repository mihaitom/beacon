name: Publish Linux (Manual)

on: workflow_dispatch

jobs:
    ensure-release:
        permissions:
            contents: write
        uses: ./.github/workflows/_ensure-release.yml

    publish-electron:
        needs: ensure-release
        permissions:
            contents: write
        uses: ./.github/workflows/_publish-electron.yml
        with:
            # x64 and arm64 each build on their own native runner — the bundled
            # Connect backend binary is built by PyInstaller during
            # `pnpm run package:connect` and can't be cross-compiled (arm64
            # Linux also has no built-in x64 emulation, so a mismatched binary
            # won't run). Each leg's own script passes an explicit --x64/--arm64
            # to electron-builder so it only packages its own runner's binary
            # instead of also attempting the other arch's package (which would
            # otherwise bundle the wrong-arch connect-server binary).
            matrix: |
                [
                  {"os": "ubuntu-latest", "script": "publish:linux"},
                  {"os": "ubuntu-24.04-arm", "script": "publish:linux-arm64", "arm64_build_tools": true}
                ]
